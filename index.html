<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Management Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div>
        <h1>Student Management Dashboard</h1>
        <p class="subtitle">Manage records, tracks, and enrollments with local storage</p>
      </div>
      <button id="openModalBtn" class="btn btn-primary">+ Add New Student</button>
    </header>

    <section class="controls-card">
      <div class="search-box">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search by name, roll number, or email..." 
        />
      </div>
      <div class="filter-box">
        <select id="courseFilter">
          <option value="all">All Departments / Courses</option>
          <option value="Computer Science">Computer Science</option>
          <option value="Information Technology">Information Technology</option>
          <option value="AI & ML">AI & ML</option>
          <option value="Electronics">Electronics</option>
        </select>
        <select id="statusFilter">
          <option value="all">All Statuses</option>
          <option value="Active">Active</option>
          <option value="Graduated">Graduated</option>
          <option value="Suspended">Suspended</option>
        </select>
      </div>
    </section>

    <section class="table-card">
      <div class="table-responsive">
        <table id="studentTable">
          <thead>
            <tr>
              <th>Roll No</th>
              <th>Full Name</th>
              <th>Email</th>
              <th>Department</th>
              <th>Year</th>
              <th>Status</th>
              <th class="actions-header">Actions</th>
            </tr>
          </thead>
          <tbody id="studentTableBody">
            <!-- Student rows will be rendered here -->
          </tbody>
        </table>
      </div>
      <div id="emptyState" class="empty-state hidden">
        <p>No matching student records found.</p>
      </div>
    </section>
  </div>

  <!-- Student Form Modal (Add & Edit) -->
  <div id="studentModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Add Student Record</h2>
        <button id="closeModalBtn" class="close-btn">&times;</button>
      </div>
      <form id="studentForm">
        <input type="hidden" id="studentId" />

        <div class="form-row">
          <div class="form-group">
            <label for="rollNo">Roll / Student ID *</label>
            <input type="text" id="rollNo" required placeholder="e.g. CS2026-01" />
          </div>
          <div class="form-group">
            <label for="fullName">Full Name *</label>
            <input type="text" id="fullName" required placeholder="e.g. John Doe" />
          </div>
        </div>

        <div class="form-row">
